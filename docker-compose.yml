services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ipsistemas-users-api
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3001}:3000"
    environment:
      - PORT=3000
      - DB_DATABASE=/app/data/database.sqlite
      - DB_LOGGING=false
      - DB_SYNCHRONIZE=${DB_SYNCHRONIZE:-false}
      - WHISPER_URL=http://speaches:8000/v1
      - API_BEARER_TOKEN=${API_BEARER_TOKEN:-secret-lan-token}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-dummy-key}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-google/gemini-2.5-flash}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - WEBHOOK_AUTH_HEADER=${WEBHOOK_AUTH_HEADER:-X-N8N-Webhook-Token}
      - WEBHOOK_AUTH_TOKEN=${WEBHOOK_AUTH_TOKEN}
      - TEMP_DIR=/app/temp
    volumes:
      - app-data:/app/data
      - app-temp:/app/temp
    depends_on:
      - speaches
    networks:
      - ipsistemas-network

  database:
    image: postgres:16-alpine
    container_name: ipsistemas_db
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=${DB_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_DATABASE:-backoffice}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-backoffice}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ipsistemas-network

networks:
  ipsistemas-network:
    driver: bridge

volumes:
  app-data:
  app-temp:
  speaches-cache:
